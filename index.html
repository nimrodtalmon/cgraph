<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contribution Graph</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Cpath d='M6 16L16 6M6 16H16' stroke='%238a8f96' stroke-width='1.6'/%3E%3Ccircle cx='6' cy='16' r='3.6' fill='%232f6f8f'/%3E%3Ccircle cx='16' cy='6' r='3.6' fill='%23c4702a'/%3E%3Ccircle cx='16' cy='16' r='3.6' fill='%232f7a5e'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f3ef; --card: #fff; --text: #1f2328; --muted: #6b6f76; --line: #e3e1da; --soft: #f7f6f2;
    --co: #c4702a; --co-bg: #fbf7f2; --co-soft: #f3e2d1;
    --cu: #2f6f8f; --cu-bg: #f2f6f9; --cu-soft: #d8e6ee;
    --m: var(--co); --m-bg: var(--co-bg); --m-soft: var(--co-soft);
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.06);
    --pop: 0 10px 34px rgba(0,0,0,.16);
  }
  body.curate { --m: var(--cu); --m-bg: var(--cu-bg); --m-soft: var(--cu-soft); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg.ic { display: block; }

  /* header */
  header { display: flex; align-items: center; gap: .7em; height: 54px; padding: 0 .9em; background: var(--card);
           border-bottom: 1px solid var(--line); position: relative; z-index: 10; }
  .brand { display: flex; align-items: center; gap: .5em; font-weight: 650; font-size: 1.05em; white-space: nowrap; }
  .q { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); background: var(--soft);
       font-size: 11.5px; font-weight: 650; color: var(--muted); padding: 0; line-height: 18px; flex: none; }
  .q:hover { color: var(--text); border-color: #c9c6bd; }
  .spacer { flex: 1; }
  .modes { position: relative; display: flex; background: var(--soft); border: 1px solid var(--line); border-radius: 11px; padding: 3px; }
  .modes button { position: relative; z-index: 1; border: 0; background: none; padding: .38em 1em; border-radius: 8px;
                  font-weight: 600; color: var(--muted); transition: color .2s; display: flex; align-items: center; gap: .4em; }
  .modes button.on { color: #fff; }
  .modes .thumb { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 8px; background: var(--m);
                  transition: transform .28s cubic-bezier(.3,.7,.3,1), width .28s, background .28s; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .user { display: flex; align-items: center; gap: .45em; border: 1px solid var(--line); background: var(--card);
          border-radius: 99px; padding: .2em .75em .2em .22em; font-weight: 550; max-width: 14em; }
  .user:hover { border-color: #c9c6bd; }
  .user .av { width: 26px; height: 26px; border-radius: 50%; background: var(--text); color: #fff; font-size: 12px; font-weight: 700;
              display: flex; align-items: center; justify-content: center; flex: none; }
  .user .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user.none { color: var(--muted); }
  .user.none .av { background: #c9c6bd; }
  .icon { border: 1px solid var(--line); background: var(--card); border-radius: 9px; width: 32px; height: 32px; color: var(--muted);
          display: flex; align-items: center; justify-content: center; padding: 0; }
  .icon:hover { color: var(--text); border-color: #c9c6bd; }
  .menu { position: absolute; z-index: 30; background: var(--card); border: 1px solid var(--line); border-radius: 11px;
          box-shadow: var(--pop); padding: .3em; min-width: 13em; }
  .menu button { display: flex; gap: .6em; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: .48em .7em; border-radius: 7px; }
  .menu button:hover { background: var(--soft); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: .3em 0; }

  /* main area */
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--m-bg); transition: background .3s; }
  #tabs { display: flex; align-items: flex-end; gap: 2px; padding: 6px 8px 0; background: var(--bg); border-bottom: 1px solid var(--line);
          overflow-x: auto; flex: none; scrollbar-width: none; }
  .tab { display: flex; align-items: center; gap: .4em; padding: .38em .55em .38em .8em; border: 1px solid transparent; border-bottom: 0;
         border-radius: 9px 9px 0 0; color: var(--muted); background: none; white-space: nowrap; max-width: 15em; position: relative; top: 1px; }
  .tab:hover { color: var(--text); background: rgba(0,0,0,.03); }
  .tab.on { background: var(--m-bg); border-color: var(--line); color: var(--text); font-weight: 600; }
  .tab.on::before { content: ""; position: absolute; left: -1px; right: -1px; top: -1px; height: 3px; border-radius: 9px 9px 0 0; background: var(--m); }
  .tab .tn { overflow: hidden; text-overflow: ellipsis; }
  .tab .cx { border: 0; background: none; color: var(--muted); padding: 0 .15em; border-radius: 4px; line-height: 1; font-size: 1.05em; opacity: 0; }
  .tab:hover .cx, .tab.on .cx { opacity: 1; }
  .tab .cx:hover { background: rgba(0,0,0,.07); color: var(--text); }
  .tab input { font: inherit; font-weight: 600; border: 0; outline: 1px solid var(--m); border-radius: 4px; padding: 0 .2em; width: 10em; background: #fff; }
  .addtab { border: 0; background: none; color: var(--muted); font-size: 1.2em; padding: .1em .55em .3em; border-radius: 8px; line-height: 1; }
  .addtab:hover { background: rgba(0,0,0,.05); color: var(--text); }
  #canvas { flex: 1; position: relative; min-height: 0; }
  #cy { position: absolute; inset: 0; }
  #empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           color: var(--muted); pointer-events: none; gap: .2em; text-align: center; }
  #empty[hidden] { display: none; }
  #empty .big { font-size: 1.1em; color: var(--text); font-weight: 550; }
  #wire { position: absolute; inset: 0; pointer-events: none; z-index: 4; overflow: visible; }
  #handle { position: absolute; z-index: 4; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
            background: var(--co); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); cursor: crosshair; display: none; touch-action: none;
            transition: transform .12s; }
  #handle:hover { transform: scale(1.25); }
  .zoom { position: absolute; right: 12px; bottom: 12px; z-index: 3; display: flex; flex-direction: column; background: var(--card);
          border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
  .zoom button { border: 0; background: none; width: 32px; height: 30px; color: var(--muted); display: flex; align-items: center; justify-content: center; }
  .zoom button:hover { background: var(--soft); color: var(--text); }
  .zoom button + button { border-top: 1px solid var(--line); }
  .pop { position: absolute; z-index: 6; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--pop); padding: .6em; }
  .pop .ttl { font-size: .78em; color: var(--muted); margin: 0 .2em .45em; }
  .pop .labels { display: flex; flex-wrap: wrap; gap: .35em; max-width: 280px; }
  .pop .labels button { border: 1px solid var(--co-soft); background: var(--co-bg); color: var(--co); border-radius: 99px; padding: .25em .8em; font-weight: 550; }
  .pop .labels button:hover { background: var(--co); color: #fff; }
  .pop .labels button.gen { border-style: dashed; }
  .editor { position: absolute; z-index: 6; transform: translate(-50%,-50%); background: #fff; border: 2px solid var(--tc);
            border-radius: 11px; padding: .4em .55em .35em; box-shadow: var(--pop); width: 230px; display: flex; gap: .5em; align-items: center; }
  .editor .eb { flex: 1; min-width: 0; }
  .editor input { width: 100%; border: 0; background: transparent; font: inherit; font-weight: 600; outline: none; padding: .05em 0; }
  .editor .h { font-size: .7em; color: var(--muted); }
  .tip { position: absolute; z-index: 6; pointer-events: none; background: #1f2328; color: #fff; font-size: .78em;
         padding: .28em .6em; border-radius: 7px; white-space: nowrap; transform: translate(12px, 14px); }

  /* right panel */
  aside { width: 312px; flex: none; background: var(--card); border-left: 1px solid var(--line); overflow-y: auto; padding: 1em 1em 2em; }
  @media (max-width: 820px) {
    main { flex-direction: column; } #stage { min-height: 60vh; } aside { width: auto; border-left: 0; border-top: 1px solid var(--line); }
    .user .nm { display: none; } .brand .bt { display: none; }
  }
  h3 { display: flex; align-items: center; justify-content: space-between; font-size: .7em; text-transform: uppercase; letter-spacing: .1em;
       color: var(--muted); margin: 1.4em 0 .55em; font-weight: 650; }
  h3:first-child { margin-top: 0; }
  .types { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .4em; }
  .type { display: flex; flex-direction: column; align-items: center; gap: .25em; padding: .55em .2em .45em; border-radius: 11px;
          border: 1px solid var(--line); background: var(--soft); cursor: grab; user-select: none; touch-action: none; font-size: .8em;
          transition: transform .12s, box-shadow .12s, border-color .12s, background .12s; }
  .type:hover { transform: translateY(-1px); box-shadow: var(--shadow); border-color: var(--tc); background: var(--tb); }
  .type:active { cursor: grabbing; }
  .hint { font-size: .8em; color: var(--muted); margin-top: .6em; line-height: 1.5; }
  .hint .dot { vertical-align: -1px; margin: 0 .1em; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--co); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--co-soft); }
  .ghost { position: fixed; z-index: 50; pointer-events: none; display: flex; gap: .45em; align-items: center; padding: .35em .75em .35em .4em;
           border-radius: 10px; border: 2px solid var(--tc); background: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.18);
           transform: translate(-50%,-50%) rotate(-2.5deg); font-weight: 600; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: .8em .9em; }
  .head { display: flex; align-items: center; gap: .5em; }
  .tname { font-size: .72em; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--tc); }
  .ctitle { font-weight: 650; font-size: 1.04em; margin: .45em 0 .2em; word-break: break-word; }
  .content { white-space: pre-wrap; word-break: break-word; font-size: .93em; }
  .meta { font-size: .82em; color: var(--muted); margin-top: .55em; }
  .meta button, .linkb { border: 0; background: none; color: var(--cu); padding: 0; }
  .linkb:hover, .meta button:hover { text-decoration: underline; }
  input.f, textarea.f { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: .42em .55em; background: var(--soft); }
  input.f:focus, textarea.f:focus { outline: 2px solid var(--m-soft); border-color: var(--m); background: #fff; }
  textarea.f { min-height: 5.5em; resize: vertical; }
  .btn { border: 0; border-radius: 9px; padding: .45em 1em; font-weight: 600; background: var(--m); color: #fff; display: inline-flex; align-items: center; gap: .4em; text-decoration: none; }
  .btn.sec { background: var(--soft); color: var(--text); border: 1px solid var(--line); }
  .btn:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: .45em; align-items: center; }
  .stats { display: flex; gap: .5em; }
  .stat { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: .45em .65em; }
  .stat b { display: block; font-size: 1.3em; line-height: 1.15; }
  .stat span { font-size: .76em; color: var(--muted); }
  .muted { color: var(--muted); font-size: .88em; }
  .err { color: #b23a2b; font-size: .86em; margin-top: .6em; }
  .ok { color: var(--m); font-size: .86em; margin-top: .6em; }
  .frontlist { display: flex; flex-wrap: wrap; gap: .35em; }
  .fchip { display: inline-flex; align-items: center; gap: .35em; border: 2px solid #1f2328; background: #fff; border-radius: 99px;
           padding: .12em .65em .12em .2em; font-size: .84em; font-weight: 550; }
  .curs { display: flex; flex-direction: column; gap: .4em; }
  .cur { display: flex; align-items: center; gap: .6em; text-align: left; border: 1px solid var(--line); background: var(--soft);
         border-radius: 11px; padding: .5em .65em; transition: border-color .12s, background .12s; }
  .cur:hover { border-color: var(--cu); }
  .cur.on { border: 1.5px solid var(--cu); background: var(--cu-bg); }
  .cur .ca { width: 28px; height: 28px; border-radius: 8px; background: var(--cu); color: #fff; font-weight: 700; font-size: 12px;
             display: flex; align-items: center; justify-content: center; flex: none; }
  .cur.view .ca { background: #9aa3aa; }
  .cur .cn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
  .cur.add { border-style: dashed; color: var(--muted); background: none; }
  .cur.add .ca { background: none; border: 1.5px dashed #b9bcc1; color: var(--muted); font-size: 16px; }
  .tag { font-size: .72em; border-radius: 99px; padding: .05em .55em; white-space: nowrap; }
  .tag.y { background: var(--cu-soft); color: var(--cu); }
  .tag.n { border: 1px dashed #c9c6bd; color: var(--muted); }
  code { font-size: .82em; background: var(--soft); padding: .1em .35em; border-radius: 5px; word-break: break-all; }
  .sub { margin-top: .55em; padding-top: .55em; border-top: 1px solid var(--line); font-size: .85em; }
  /* modal */
  .backdrop { position: fixed; inset: 0; background: rgba(20,22,25,.32); z-index: 40; display: flex; align-items: center; justify-content: center;
              padding: 1em; animation: fade .15s ease; }
  .modal { background: var(--card); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.25); max-width: 33em; width: 100%;
           padding: 1.35em 1.5em 1.3em; position: relative; max-height: 88vh; overflow-y: auto; animation: rise .18s ease; }
  @keyframes fade { from { opacity: 0; } } @keyframes rise { from { transform: translateY(8px); opacity: 0; } }
  .modal h2 { margin: 0 0 .6em; font-size: 1.15em; }
  .modal p { margin: .5em 0; }
  .modal .x { position: absolute; right: .8em; top: .7em; border: 0; background: none; font-size: 1.3em; color: var(--muted); }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: .5em .8em; align-items: center; margin: .8em 0; font-size: .93em; }
  .sw { width: 46px; height: 22px; border-radius: 7px; }
  .steps { list-style: none; padding: 0; margin: .4em 0; }
  .steps li { display: flex; gap: .7em; align-items: flex-start; margin: .65em 0; }
  .steps .n { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--co-soft); color: var(--co); font-weight: 700;
              display: flex; align-items: center; justify-content: center; font-size: .85em; }
  .range { margin: .9em 0; }
  .range label { display: flex; justify-content: space-between; font-size: .9em; }
  .range input { width: 100%; accent-color: var(--cu); }
  .glist { display: flex; flex-direction: column; gap: .3em; max-height: 50vh; overflow-y: auto; margin-top: .6em; }
  .glist button { display: flex; justify-content: space-between; gap: 1em; text-align: left; border: 1px solid var(--line); background: var(--soft);
                  border-radius: 9px; padding: .5em .7em; }
  .glist button:hover { border-color: var(--m); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="ic" width="22" height="22" viewBox="0 0 22 22"><path d="M6 16 L16 6 M6 16 L16 16" stroke="#8a8f96" stroke-width="1.6"/><circle cx="6" cy="16" r="3.6" fill="#2f6f8f"/><circle cx="16" cy="6" r="3.6" fill="#c4702a"/><circle cx="16" cy="16" r="3.6" fill="#2f7a5e"/></svg>
    <span class="bt">Contribution Graph</span>
    <button class="q" id="helpBtn" title="What is this?">?</button>
  </div>
  <div class="spacer"></div>
  <div class="modes" role="tablist">
    <span class="thumb" id="thumb"></span>
    <button data-mode="contribute" id="mContribute">Contribute</button>
    <button data-mode="curate" id="mCurate">Curate</button>
  </div>
  <button class="q" id="modeHelp" title="How this mode works">?</button>
  <div class="spacer"></div>
  <button class="user" id="userBtn" title="Your name"></button>
  <button class="icon" id="menuBtn" title="View"><svg class="ic" width="18" height="18" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg></button>
</header>
<main>
  <div id="stage">
    <div id="tabs"></div>
    <div id="canvas">
      <div id="cy"></div>
      <div id="empty" hidden></div>
      <svg id="wire"></svg>
      <div id="handle" title="Drag to the node this builds on"></div>
      <div class="zoom">
        <button id="zIn" title="Zoom in"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.8"/></svg></button>
        <button id="zOut" title="Zoom out"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 7h10" stroke="currentColor" stroke-width="1.8"/></svg></button>
        <button id="zFit" title="Fit"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M1.5 5V1.5H5M9 1.5h3.5V5M12.5 9v3.5H9M5 12.5H1.5V9" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></button>
      </div>
    </div>
  </div>
  <aside id="panel"></aside>
</main>
<div id="modalRoot"></div>

<script src="vendor/cytoscape.min.js"></script>
<script src="vendor/dagre.min.js"></script>
<script src="vendor/cytoscape-dagre.js"></script>
<script>
"use strict";
// ---------- types and their icons ----------
const TYPE = {
  problem:    { c: "#b55a5a", b: "#f7e6e6" },
  assumption: { c: "#7d5ba6", b: "#efe8f6" },
  model:      { c: "#2f6f8f", b: "#dfecf4" },
  theorem:    { c: "#2f7a5e", b: "#e1f1e7" },
  algorithm:  { c: "#946a1c", b: "#f6eedb" },
  dataset:    { c: "#4f7a85", b: "#e4eef1" },
  experiment: { c: "#b5652d", b: "#f8e6d8" },

  other:      { c: "#6b6f76", b: "#eeeeec" },
};
const W = 'stroke="#fff" fill="none" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"';
const ICON = {
  problem:    `<path d="M9.2 9.3a2.9 2.9 0 1 1 4.2 2.6c-.9.5-1.4 1.1-1.4 2.1v.4" ${W}/><circle cx="12" cy="17.6" r="1.25" fill="#fff"/>`,
  assumption: `<path d="M12 6.5v11M7.2 9.2l9.6 5.6M7.2 14.8l9.6-5.6" ${W}/>`,
  model:      `<path d="M12 5.5l6.5 6.5-6.5 6.5L5.5 12z" ${W}/>`,
  theorem:    `<circle cx="12" cy="7.8" r="1.9" fill="#fff"/><circle cx="7.6" cy="16" r="1.9" fill="#fff"/><circle cx="16.4" cy="16" r="1.9" fill="#fff"/>`,
  algorithm:  `<path d="M9.3 7l-4 5 4 5M14.7 7l4 5-4 5" ${W}/>`,
  dataset:    `<ellipse cx="12" cy="7.4" rx="5.6" ry="2.2" ${W}/><path d="M6.4 7.4v9.2c0 1.2 2.5 2.2 5.6 2.2s5.6-1 5.6-2.2V7.4M6.4 12c0 1.2 2.5 2.2 5.6 2.2s5.6-1 5.6-2.2" ${W}/>`,
  experiment: `<path d="M10 5.5h4M10.6 5.5v4.8l-4.3 7.4a1 1 0 0 0 .9 1.5h9.6a1 1 0 0 0 .9-1.5l-4.3-7.4V5.5M8.3 15h7.4" ${W}/>`,
  claim:      `<path d="M7.5 17c0-4 .9-6.2 3.6-8.3M13.3 17c0-4 .9-6.2 3.6-8.3" ${W}/>`,
  other:      `<circle cx="7" cy="12" r="1.7" fill="#fff"/><circle cx="12" cy="12" r="1.7" fill="#fff"/><circle cx="17" cy="12" r="1.7" fill="#fff"/>`,
};
const badgeSvg = (t, size) => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24"><rect width="24" height="24" rx="6.5" fill="${TYPE[t].c}"/>${ICON[t]}</svg>`;
const badgeUri = t => "data:image/svg+xml;utf8," + encodeURIComponent(badgeSvg(t, 48));
function badge(t, size) { const s = document.createElement("span"); s.style.display = "inline-flex"; s.innerHTML = badgeSvg(t, size || 20); return s; }
const CU = "#2f6f8f", CO = "#c4702a";

// ---------- state ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem("cg_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("cg_" + k, JSON.stringify(v)); } catch (e) {} },
};
const q0 = new URLSearchParams(location.search);

    const a = A(id); return { n: [a.src, a.dst].filter(x => !an.has(x)), a: aa.has(id) ? [] : [id] };
  }
  if (kind === "a") return { n: [], a: aa.has(id) ? [id] : [] };
  return { n: an.has(id) ? [id] : [], a: S.cur.arcs.filter(x => { const a = A(x); return a && (a.src === id || a.dst === id); }) };
}

  const extra = eff.n.length + eff.a.length - 1;
  const txt = !own ? (acc ? "accepted" : "not accepted") : (acc ? "click to un-accept" : "click to accept") + (extra > 0 ? ` · ${extra} more` : "");
  const p = e.renderedPosition || e.target.renderedPosition();

      S.cur = await api(`curator/${S.curId}/${accept ? "accept" : "unaccept"}`, { key: keyOf(S.curId), kind, id });

}
async function undo() {
  const u = S.undo.pop(); if (!u) return;
  try { S.cur = await api(`curator/${S.curId}/restore`, { key: keyOf(S.curId), nodes: u.nodes, arcs: u.arcs }); paint(); render(); }
  catch (e) { flash(e.message, true); }
}

// ---------- right panel ----------
function render() {
  const p = document.getElementById("panel");
  p.replaceChildren(...[S.mode === "contribute" ? contributePanel() : curatePanel(),
    S.msg ? h("div", { class: S.msg.err ? "err" : "ok" }, S.msg.text) : null].flat(3).filter(Boolean));
}
function details() {

    const n = N(S.sel.id);
    const out = S.g.arcs.filter(a => a.src === n.id), inn = S.g.arcs.filter(a => a.dst === n.id);

            catch (e) { flash(e.message, true); } } }, "Save"),

      inn.length ? h("div", { class: "meta" }, "Built on by: ", inn.map((a, i) => [i ? " · " : "", linkTo(a.src), " ", h("i", {}, a.label)])) : null,
      h("div", { class: "meta" }, `by ${n.author} · ${new Date(n.created * 1000).toLocaleDateString()}`,

      h("span", { style: { color: TYPE[d.type].c } }, nm(d))),
    h("div", { class: "meta" }, `by ${a.author}`, a.accepts ? ` · accepted by ${a.accepts} curator${a.accepts > 1 ? "s" : ""}` : ""),
    S.mode === "contribute" && mine("a", a.id) && !a.accepts
      ? h("div", { style: { marginTop: ".6em" } }, h("button", { class: "btn sec", onclick: () => removeIt("a", a.id) }, "Delete")) : null);
}
async function removeIt(kind, id) {
  try { await api("delete", { kind, id, token: tokenOf(kind, id) }); S.sel = null; await refresh(); flash("Deleted."); loadGraphs(); }
  catch (e) { flash(e.message, true); }
}
function center(id) { const el = cy.$id("n" + id); if (el.nonempty()) cy.animate({ center: { eles: el }, duration: 300 }); }
function contributePanel() {
  return [
    h("h3", {}, "Add a contribution"),
    h("div", { class: "types" }, Object.keys(TYPE).map(t => {
      const el = h("div", { class: "type", style: tvars(t), title: `Drag a ${t} onto the canvas` }, badge(t, 26), t);
      el.addEventListener("pointerdown", e => startTypeDrag(e, t));

    })),
    h("div", { class: "hint" }, "Drag onto the canvas. To connect, drag a node's ", h("span", { class: "dot" }), " to what it builds on."),
    S.sel ? [h("h3", {}, "Selected"), details()] : null,

}
function curatorCard(c) {
  const own = !!keyOf(c.id), on = c.id === S.curId;
  if (on && S.renaming === "cur") {
    const inp = h("input", { class: "f", value: c.name, maxlength: 60 });
    const done = async ok => {
      S.renaming = null;
      if (ok && inp.value.trim()) { try { await api(`curator/${c.id}/rename`, { key: keyOf(c.id), name: inp.value }); await refresh(); } catch (e) { flash(e.message, true); } }
      render();
    };
    inp.addEventListener("keydown", e => { if (e.key === "Enter") done(true); if (e.key === "Escape") done(false); });
    setTimeout(() => { inp.focus(); inp.select(); }, 0);

  }
  return h("button", { class: "cur" + (on ? " on" : "") + (own ? "" : " view"), onclick: () => chooseCurator(on ? null : c.id) },
    h("span", { class: "ca" }, initial(c.name)), h("span", { class: "cn" }, c.name),
    own ? h("span", { class: "tag y" }, "yours") : h("span", { class: "tag n" }, "view"));

function curatePanel() {
  const els = [h("h3", {}, "Curators")];

  const list = h("div", { class: "curs" }, curs.map(curatorCard));

    const create = async () => {
      if (!inp.value.trim()) return;

      catch (e) { flash(e.message, true); }

    setTimeout(() => inp.focus(), 0);
    list.append(h("div", { class: "cur on" }, h("span", { class: "ca" }, "+"), inp, h("button", { class: "btn", onclick: create }, "Add")));
  } else {

  }
  els.push(list);
  if (!S.curId) {
    els.push(h("p", { class: "muted", style: { marginTop: "1em" } }, curs.length ? "Choose a curator to see what it accepted, or add your own." : "Add a curator, such as a venue or a lab, to start accepting contributions."));
    return els;
  }

      h("button", { class: "linkb", onclick: () => { S.renaming = "cur"; render(); } }, "Rename"), h("span", { class: "muted" }, "·"),
      h("button", { class: "linkb", onclick: () => { S.showKey = !S.showKey; render(); } }, S.showKey ? "Hide key" : "Key"),
      h("span", { class: "spacer" }),
      h("button", { class: "btn sec", disabled: !S.undo.length, onclick: undo, title: S.undo.length ? "Undo: " + S.undo[S.undo.length - 1].what : "Nothing to undo" }, "↶ Undo")));
    if (S.showKey) els.push(h("div", { class: "muted", style: { marginTop: ".4em" } }, "To curate from another browser: ", h("code", {}, keyOf(S.curId))));
  } else {

    els.push(h("div", { class: "sub row" }, ki, h("button", { class: "btn", onclick: async () => {
      try { await api(`curator/${S.curId}/check`, { key: ki.value.trim() }); putKey(GID, S.curId, ki.value.trim()); render(); renderTabs(); }
      catch (e) { flash(e.message, true); } } }, "Use")));
  }
  els.push(h("div", { class: "stats", style: { marginTop: ".9em" } },
    h("div", { class: "stat" }, h("b", { style: { color: CU } }, v.nodes.length + v.arcs.length), h("span", {}, `accepted of ${S.g.nodes.length + S.g.arcs.length}`)),
    h("div", { class: "stat" }, h("b", {}, v.front.length), h("span", {}, "on the front"))));
  els.push(h("h3", {}, "Front"),
    v.front.length ? h("div", { class: "frontlist" }, v.front.map(id => { const n = N(id); return n ? h("button", { class: "fchip",
      onclick: () => { center(id); select("n", id); } }, badge(n.type, 18), n.title) : null; }))
      : h("div", { class: "muted" }, own ? "Nothing accepted yet. Click a node to accept it." : "Nothing accepted yet."),
    h("div", { class: "row", style: { marginTop: ".9em" } },
      h("a", { class: "btn", href: `api/g/${GID}/curator/${S.curId}/export` }, "Export front"),
      h("button", { class: "btn sec", onclick: copyLink }, "Copy link")));
  if (S.sel) {
    const acc = isAcc(S.sel.kind, S.sel.id);

  }
  return els;
}
async function chooseCurator(id) {

  setUrl(); await refresh();
}
async function copyLink() {
  const u = new URL(location.href);
  try { await navigator.clipboard.writeText(u.toString()); flash("Link copied."); } catch (e) { flash(u.toString()); }
}

// ---------- modals ----------
function modal(content, onClose) {
  const root = document.getElementById("modalRoot");
  const close = () => { root.replaceChildren(); document.removeEventListener("keydown", esc); onClose && onClose(); };
  const esc = e => { if (e.key === "Escape") close(); };
  const bd = h("div", { class: "backdrop", onclick: e => { if (e.target === bd) close(); } },
    h("div", { class: "modal" }, h("button", { class: "x", onclick: close, title: "Close" }, "×"), content(close)));
  root.replaceChildren(bd); document.addEventListener("keydown", esc);
  const f = bd.querySelector("input"); if (f) setTimeout(() => f.focus(), 0);
}
function ensureName(force) {
  const cur = store.get("name", "");
  if (cur && !force) return Promise.resolve(true);
  return new Promise(res => {
    let done = false;
    modal(close => {
      const inp = h("input", { class: "f", value: cur, maxlength: 60, placeholder: "Your name" });
      const ok = () => { if (!inp.value.trim()) return; store.set("name", inp.value.trim()); done = true; close(); renderUser(); render(); };
      inp.addEventListener("keydown", e => { if (e.key === "Enter") ok(); });
      return [h("h2", {}, "Your name"), h("p", { class: "muted" }, "Shown on what you contribute."), inp,
        h("div", { style: { marginTop: "1em" } }, h("button", { class: "btn", style: { background: "#1f2328" }, onclick: ok }, "Save"))];
    }, () => res(done));
  });
}
const sw = (t, extra) => h("div", { class: "sw", style: Object.assign({ background: TYPE[t].b, border: `1.5px solid ${TYPE[t].c}` }, extra || {}) });
function helpModal() {
  modal(() => [
    h("h2", {}, "Contribution graphs"),
    h("p", {}, "Science as a graph instead of a pile of papers. ", h("b", {}, "Nodes"), " are models, theorems, datasets, experiments and so on; ",
      h("b", {}, "arcs"), " say how one builds on another, such as an experiment that ", h("i", {}, "validates"), " a model. Each node and each arc is a ",
      h("b", {}, "contribution"), ", credited to whoever added it."),
    h("p", {}, h("b", { style: { color: CO } }, "Contribute"), " to add nodes and arcs; ", h("b", { style: { color: CU } }, "Curate"),
      " to accept them as a curator, such as a venue or a lab. A curator's ", h("b", {}, "front"), " is what it accepted that nothing it accepted builds on yet."),
    h("p", { class: "muted" }, "Each tab is a graph. Use + to start a new graph, open an existing one, or generate a sample to play with."),
  ]);
}
function modeHelp() {
  if (S.mode === "contribute") modal(() => [
    h("h2", { style: { color: CO } }, "Contribute"),
    h("ol", { class: "steps" },
      h("li", {}, h("span", { class: "n" }, "1"), h("div", {}, h("b", {}, "Drag a contribution type"), " from the right onto the canvas, and name it.")),
      h("li", {}, h("span", { class: "n" }, "2"), h("div", {}, h("b", {}, "Connect: "), "hover a node, drag its ", h("span", { class: "dot" }), " to the node it builds on, and pick a label.")),
      h("li", {}, h("span", { class: "n" }, "3"), h("div", {}, h("b", {}, "Add details"), " by clicking your node. You can edit or delete your contributions until a curator accepts them."))),
    h("p", { class: "muted" }, "Drag nodes to arrange them; the layout is shared."),
  ]);
  else modal(() => [
    h("h2", { style: { color: CU } }, "Curate"),
    h("p", {}, "Pick a curator on the right, or add your own. Then hover a node or an arc to see what a click would change, and click to accept or un-accept."),
    h("p", {}, "Accepting an arc also accepts its two ends; un-accepting a node also removes its accepted arcs."),
    h("div", { class: "legend" },
      sw("model", { background: "#fff", border: "1.5px dashed #b9bcc1" }), h("span", {}, "not accepted (yet)"),
      sw("model"), h("span", {}, "accepted"),
      sw("model", { border: "3px solid #1f2328", boxShadow: "0 0 0 5px rgba(31,35,40,.13)" }), h("span", {}, h("b", {}, "front"), ": accepted, and nothing accepted builds on it yet")),
    h("p", { class: "muted" }, "Export the front as JSON. Ctrl-Z undoes."),
  ]);
}
function sampleModal() {

  modal(close => {
    const rng = (k, label, min, max, step, fmt) => {
      const out = h("b", {}, fmt(vals[k]));
      const inp = h("input", { type: "range", min, max, step, value: vals[k], oninput: e => { vals[k] = +e.target.value; out.textContent = fmt(vals[k]); } });

      rng("nodes", "Nodes", 5, 150, 1, v => v),
      rng("arcs", "Arcs per node", 0, 3, 0.1, v => v.toFixed(1)),

      go];

}
async function openModal() {
  await loadGraphs();
  modal(close => {
    const inp = h("input", { class: "f", placeholder: "Search graphs" });
    const list = h("div", { class: "glist" });
    const draw = () => list.replaceChildren(...S.graphs.filter(g => g.name.toLowerCase().includes(inp.value.toLowerCase())).map(g =>
      h("button", { onclick: () => { close(); switchGraph(g.id); } }, h("span", {}, g.name), h("span", { class: "muted" }, `${g.nodes} nodes · ${g.arcs} arcs`))));

  e.stopPropagation(); const r = e.currentTarget.getBoundingClientRect();
  menu(r.right - 220, r.bottom + 6, [["Tidy up the layout", () => tidy(false)], ["Fit to screen", fit], "-", ["What is this?", helpModal]]);
};
document.addEventListener("click", e => { if (menuEl && !menuEl.contains(e.target)) closeMenu(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closePop(); closeMenu(); }
  if ((e.ctrlKey || e.metaKey) && e.key === "z" && S.mode === "curate" && !e.target.matches("input,textarea")) { e.preventDefault(); undo(); }
});
window.addEventListener("resize", placeThumb);
(async () => {
  initCy(); renderUser(); openTabs(); setMode(S.mode); store.set("last", GID);
  try { await refresh(); cy.fit(undefined, 50); if (cy.zoom() > 1.3) { cy.zoom(1.3); cy.center(); } }
  catch (e) {
    if (GID !== "main") { GID = "main"; store.set("tabs", openTabs().filter(x => x !== q0.get("g"))); try { await refresh(); } catch (e2) {} }
    else document.getElementById("panel").textContent = "Cannot load this graph: " + e.message;
  }
  loadGraphs();
  if (!store.get("seen", false)) { store.set("seen", true); helpModal(); }
  setInterval(() => {
    if (document.visibilityState !== "visible" || popEl || wiring || S.busy || menuEl || S.adding || S.renaming
        || document.getElementById("modalRoot").childNodes.length || document.activeElement.matches("input,textarea") || cy.nodes(":grabbed").length) return;
    refresh().catch(() => {});
  }, 10000);
})();
