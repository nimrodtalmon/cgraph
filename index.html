<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contribution Graph</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='4' cy='12' r='3' fill='%232f6f8f'/%3E%3Ccircle cx='12' cy='4' r='3' fill='%23c4702a'/%3E%3Cpath d='M5.5 10.5l5-5' stroke='%23555' stroke-width='1.4'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f3ef; --card: #fff; --text: #1f2328; --muted: #6b6f76; --line: #e3e1da;
    --co: #c4702a; --co-bg: #fbf6f0; --co-soft: #f6e6d6;
    --cu: #2f6f8f; --cu-bg: #f1f6f9; --cu-soft: #dbe8ef;
    --m: var(--co); --m-bg: var(--co-bg); --m-soft: var(--co-soft);
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.06);
  }
  body.curate { --m: var(--cu); --m-bg: var(--cu-bg); --m-soft: var(--cu-soft); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text);
         font: 14.5px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  /* header */
  header { display: flex; align-items: center; gap: .8em; padding: .55em 1em; background: var(--card);
           border-bottom: 1px solid var(--line); position: relative; z-index: 5; }
  .brand { display: flex; align-items: center; gap: .5em; font-weight: 650; font-size: 1.08em; letter-spacing: .01em; white-space: nowrap; }
  .logo { width: 22px; height: 22px; }
  .q { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg);
       font-size: 12px; font-weight: 600; color: var(--muted); padding: 0; line-height: 18px; }
  .q:hover { color: var(--text); border-color: var(--muted); }
  .chip { font-size: .8em; padding: .15em .6em; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .chip a { color: var(--cu); text-decoration: none; margin-left: .4em; }
  .spacer { flex: 1; }
  .modes { position: relative; display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
  .modes button { position: relative; z-index: 1; border: 0; background: none; padding: .42em 1.05em; border-radius: 9px;
                  font-weight: 600; color: var(--muted); transition: color .2s; display: flex; align-items: center; gap: .45em; }
  .modes button.on { color: #fff; }
  .modes .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; border-radius: 9px; background: var(--m);
                  transition: transform .25s ease, width .25s ease, background .25s; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .icon { border: 1px solid var(--line); background: var(--card); border-radius: 9px; width: 34px; height: 32px; font-size: 18px; line-height: 1; color: var(--muted); }
  .icon:hover { color: var(--text); }
  .menu { position: absolute; right: 1em; top: 100%; margin-top: 4px; background: var(--card); border: 1px solid var(--line);
          border-radius: 10px; box-shadow: var(--shadow); padding: .3em; min-width: 14em; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: .45em .7em; border-radius: 7px; }
  .menu button:hover { background: var(--bg); }
  /* layout */
  main { flex: 1; display: flex; min-height: 0; }
  #toolbox { width: 112px; padding: .8em .6em; background: var(--card); border-right: 1px solid var(--line);
             overflow-y: auto; transition: margin .25s ease; }
  body.curate #toolbox { margin-left: -112px; }
  .tb-title { font-size: .72em; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 .5em .2em; }
  .part { display: flex; flex-direction: column; align-items: center; gap: .1em; padding: .5em .2em; margin-bottom: .45em;
          border-radius: 10px; border: 1.5px solid var(--tc); background: var(--tb); cursor: grab; user-select: none;
          touch-action: none; transition: transform .12s, box-shadow .12s; font-size: .85em; }
  .part:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .part .g { font-size: 1.35em; line-height: 1.1; color: var(--tc); }
  .ghost { position: fixed; z-index: 50; pointer-events: none; padding: .4em .8em; border-radius: 9px; border: 1.5px solid var(--tc);
           background: var(--tb); box-shadow: 0 6px 20px rgba(0,0,0,.15); transform: translate(-50%,-50%) rotate(-3deg); font-weight: 600; }
  #stage { flex: 1; min-width: 0; position: relative; background: var(--m-bg); transition: background .3s; border-top: 3px solid var(--m); }
  #cy { position: absolute; inset: 0; }
  #banner { position: absolute; left: 12px; top: 10px; z-index: 3; font-size: .85em; padding: .3em .75em; border-radius: 99px;
            background: var(--card); border: 1px solid var(--m-soft); color: var(--m); box-shadow: var(--shadow); pointer-events: none; }
  #banner b { font-weight: 650; }
  #empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           color: var(--muted); pointer-events: none; gap: .3em; text-align: center; }
  #empty[hidden] { display: none; }
  #empty .big { font-size: 1.15em; color: var(--text); }
  #wire { position: absolute; inset: 0; pointer-events: none; z-index: 4; overflow: visible; }
  #handle { position: absolute; z-index: 4; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
            background: var(--co); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); cursor: crosshair; display: none; touch-action: none; }
  #handle:hover { transform: scale(1.2); }
  .pop { position: absolute; z-index: 6; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
         box-shadow: 0 8px 28px rgba(0,0,0,.14); padding: .6em; }
  .pop .ttl { font-size: .78em; color: var(--muted); margin: 0 .2em .4em; }
  .pop .labels { display: flex; flex-wrap: wrap; gap: .35em; max-width: 270px; }
  .pop .labels button { border: 1px solid var(--m-soft); background: var(--m-bg); color: var(--m); border-radius: 99px; padding: .25em .75em; font-weight: 550; }
  .pop .labels button:hover { background: var(--m); color: #fff; }
  .pop .labels button.gen { border-style: dashed; }
  .editor { position: absolute; z-index: 6; transform: translate(-50%,-50%); background: var(--tb); border: 2px solid var(--tc);
            border-radius: 11px; padding: .35em .5em; box-shadow: 0 8px 28px rgba(0,0,0,.16); width: 210px; }
  .editor .t { font-size: .72em; color: var(--tc); text-transform: uppercase; letter-spacing: .08em; font-weight: 650; }
  .editor input { width: 100%; border: 0; background: transparent; font: inherit; font-weight: 600; outline: none; padding: .1em 0; }
  .editor .h { font-size: .7em; color: var(--muted); }
  .tip { position: absolute; z-index: 6; pointer-events: none; background: #1f2328; color: #fff; font-size: .8em;
         padding: .3em .6em; border-radius: 7px; white-space: nowrap; transform: translate(12px, 12px); }
  aside { width: 320px; background: var(--card); border-left: 1px solid var(--line); overflow-y: auto; padding: 1em 1.1em 2em; }
  @media (max-width: 820px) {
    main { flex-direction: column; } #stage { min-height: 58vh; } aside { width: auto; border-left: 0; border-top: 1px solid var(--line); }
    #toolbox { width: auto; display: flex; gap: .4em; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: .5em; }
    body.curate #toolbox { display: none; } .tb-title { display: none; } .part { min-width: 78px; margin: 0; }
  }
  h3 { font-size: .72em; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 1.4em 0 .5em; font-weight: 600; }
  h3:first-child { margin-top: 0; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: .8em .9em; box-shadow: var(--shadow); }
  .tchip { display: inline-flex; align-items: center; gap: .3em; font-size: .75em; font-weight: 650; text-transform: uppercase;
           letter-spacing: .07em; color: var(--tc); background: var(--tb); border-radius: 99px; padding: .1em .55em; }
  .ctitle { font-weight: 650; font-size: 1.05em; margin: .35em 0 .2em; word-break: break-word; }
  .content { white-space: pre-wrap; word-break: break-word; font-size: .93em; }
  .meta { font-size: .82em; color: var(--muted); margin-top: .5em; }
  .meta button, .linkb { border: 0; background: none; color: var(--cu); padding: 0; }
  .linkb:hover, .meta button:hover { text-decoration: underline; }
  input.f, textarea.f { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: .42em .55em; background: var(--bg); }
  textarea.f { min-height: 5em; resize: vertical; }
  .btn { border: 0; border-radius: 9px; padding: .45em 1em; font-weight: 600; background: var(--m); color: #fff; }
  .btn.ghostb { background: var(--bg); color: var(--text); border: 1px solid var(--line); }
  .btn.big { width: 100%; padding: .65em; font-size: 1.02em; }
  .btn:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: .45em; align-items: center; }
  .stats { display: flex; gap: .6em; }
  .stat { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: .45em .6em; }
  .stat b { display: block; font-size: 1.35em; line-height: 1.1; color: var(--cu); }
  .stat span { font-size: .78em; color: var(--muted); }
  .steps { list-style: none; padding: 0; margin: 0; }
  .steps li { display: flex; gap: .7em; align-items: flex-start; margin: .7em 0; }
  .steps .n { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--m-soft); color: var(--m); font-weight: 700;
              display: flex; align-items: center; justify-content: center; font-size: .85em; }
  .muted { color: var(--muted); font-size: .9em; }
  .err { color: #b23a2b; font-size: .88em; margin-top: .5em; }
  .ok { color: var(--m); font-size: .88em; margin-top: .5em; }
  .frontlist { display: flex; flex-wrap: wrap; gap: .35em; }
  .fchip { border: 2px solid var(--cu); background: var(--tb); border-radius: 99px; padding: .15em .65em; font-size: .85em; font-weight: 550; }
  .curs { display: flex; flex-direction: column; gap: .35em; }
  .curs button { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: .45em .7em; }
  .curs button:hover { border-color: var(--cu); }
  .tag { font-size: .75em; border-radius: 99px; padding: .05em .5em; }
  .tag.y { background: var(--cu-soft); color: var(--cu); }
  .tag.n { border: 1px dashed var(--line); color: var(--muted); }
  code { font-size: .85em; background: var(--bg); padding: .1em .35em; border-radius: 5px; word-break: break-all; }
  /* modal */
  .backdrop { position: fixed; inset: 0; background: rgba(20,22,25,.35); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 1em; }
  .modal { background: var(--card); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.25); max-width: 34em; width: 100%;
           padding: 1.4em 1.5em 1.3em; position: relative; max-height: 90vh; overflow-y: auto; }
  .modal h2 { margin: 0 0 .6em; font-size: 1.2em; }
  .modal p { margin: .5em 0; }
  .modal .x { position: absolute; right: .8em; top: .7em; border: 0; background: none; font-size: 1.3em; color: var(--muted); }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: .45em .8em; align-items: center; margin: .8em 0; font-size: .93em; }
  .sw { width: 46px; height: 22px; border-radius: 7px; }
  .range { margin: .9em 0; }
  .range label { display: flex; justify-content: space-between; font-size: .9em; }
  .range input { width: 100%; accent-color: var(--cu); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="logo" viewBox="0 0 22 22"><path d="M6 16 L16 6 M6 16 L16 16" stroke="#8a8f96" stroke-width="1.6"/><circle cx="6" cy="16" r="3.6" fill="#2f6f8f"/><circle cx="16" cy="6" r="3.6" fill="#c4702a"/><circle cx="16" cy="16" r="3.6" fill="#2f7a5e"/></svg>
    Contribution Graph
    <button class="q" id="helpBtn" title="What is this?">?</button>
  </div>
  <span id="graphChip"></span>
  <div class="spacer"></div>
  <div class="modes" role="tablist">
    <span class="thumb" id="thumb"></span>
    <button data-mode="contribute" id="mContribute">✎ Contribute</button>
    <button data-mode="curate" id="mCurate">✓ Curate</button>
  </div>
  <button class="icon" id="menuBtn" title="More">⋯</button>
  <div class="menu" id="menu" hidden></div>
</header>
<main>
  <div id="toolbox"></div>
  <div id="stage">
    <div id="cy"></div>
    <div id="banner"></div>
    <div id="empty" hidden><div class="big">An empty graph.</div><div>Drag a part from the left onto the canvas.</div></div>
    <svg id="wire"></svg>
    <div id="handle" title="Drag to another node to connect"></div>
  </div>
  <aside id="panel"></aside>
</main>
<div id="modalRoot"></div>

<script src="vendor/cytoscape.min.js"></script>
<script src="vendor/dagre.min.js"></script>
<script src="vendor/cytoscape-dagre.js"></script>
<script>
"use strict";
// ---------- constants ----------
const TYPE = {
  problem:    { g: "?", c: "#b55a5a", b: "#f6e4e4" },
  assumption: { g: "∗", c: "#7d5ba6", b: "#efe8f6" },
  model:      { g: "◇", c: "#2f6f8f", b: "#dfecf4" },
  theorem:    { g: "∴", c: "#2f7a5e", b: "#e1f1e7" },
  algorithm:  { g: "⚙", c: "#9a6b1f", b: "#f6eedb" },
  dataset:    { g: "▤", c: "#4f7a85", b: "#e4eef1" },
  experiment: { g: "⚗", c: "#b5652d", b: "#f8e6d8" },
  claim:      { g: "❝", c: "#5f6368", b: "#ececec" },
};
const CU = "#2f6f8f", CO = "#c4702a";
const q = new URLSearchParams(location.search);
const GID = q.get("g") || "main";
const S = {
  mode: q.get("mode") === "curate" || q.get("curator") ? "curate" : "contribute",
  g: null, sel: null, curId: q.get("curator") ? +q.get("curator") : null, cur: null,
  undo: [], msg: null, busy: false, showKey: false,
};
const store = {
  get(k, d) { try { const v = localStorage.getItem("cg_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("cg_" + k, JSON.stringify(v)); } catch (e) {} },
};
const keyOf = id => (store.get("keys", {}))[GID + ":" + id];
const tokenOf = (k, id) => (store.get("tokens", {}))[GID + ":" + k + id];

// ---------- helpers ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "style" && typeof v === "object") for (const [sk, sv] of Object.entries(v)) { if (sk.startsWith("--")) el.style.setProperty(sk, sv); else el.style[sk] = sv; }
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(3)) if (c !== null && c !== undefined && c !== false)
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}
const tvars = t => ({ "--tc": TYPE[t].c, "--tb": TYPE[t].b });
async function api(path, body) {
  const r = await fetch(path.startsWith("/") ? path.slice(1) : `api/g/${GID}/${path}`.replace(/\/$/, ""),
    body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: "server error" }));
  if (!r.ok) throw new Error(j.error || "error");
  return j;
}
const N = id => S.g.nodes.find(n => n.id === id);
const A = id => S.g.arcs.find(a => a.id === id);
const labelsFor = (st, dt) => { const e = S.g.schema.find(x => x.src === st && x.dst === dt); return (e ? e.labels : []); };
const nm = n => n ? n.title : "?";
const mine = (k, id) => !!tokenOf(k, id);
const flash = (text, err) => { S.msg = { text, err }; render(); setTimeout(() => { if (S.msg && S.msg.text === text) { S.msg = null; render(); } }, 2600); };

// ---------- cytoscape ----------
let cy;
function initCy() {
  cy = cytoscape({
    container: document.getElementById("cy"), maxZoom: 2.2, minZoom: 0.15, boxSelectionEnabled: false,
    style: [
      { selector: "node", style: {
        shape: "round-rectangle", label: "data(label)", "text-wrap": "wrap", "text-max-width": 160, "text-valign": "center",
        "font-size": 11.5, "font-family": "system-ui, -apple-system, Segoe UI, sans-serif", color: "#1f2328",
        "background-color": "data(bg)", "border-width": 1.6, "border-color": "data(fg)", width: "label", height: "label", padding: 10,
        "transition-property": "background-color, border-color, border-width, opacity, underlay-opacity", "transition-duration": "0.18s" } },
      { selector: "edge", style: {
        "curve-style": "bezier", "target-arrow-shape": "triangle", "arrow-scale": .85, width: 1.4, "line-color": "#8a8f96",
        "target-arrow-color": "#8a8f96", label: "data(label)", "font-size": 9.5, color: "#5f6368",
        "text-background-color": "#fff", "text-background-opacity": .9, "text-background-padding": 2, "text-background-shape": "round-rectangle",
        "transition-property": "line-color, opacity, width", "transition-duration": "0.18s" } },
      { selector: "node:selected", style: { "underlay-color": "#1f2328", "underlay-opacity": .12, "underlay-padding": 6, "underlay-shape": "round-rectangle" } },
      { selector: "edge:selected", style: { width: 3 } },
      { selector: "node.target", style: { "border-width": 3.5, "border-color": CO } },
      // curate mode
      { selector: "node.no", style: { "background-color": "#fff", "border-style": "dashed", "border-color": "#b9bcc1", color: "#8a8f96" } },
      { selector: "edge.no", style: { "line-style": "dashed", opacity: .45 } },
      { selector: "edge.acc", style: { "line-color": CU, "target-arrow-color": CU, width: 1.8 } },
      { selector: "node.front", style: { "border-width": 3.5, "border-color": CU, "underlay-color": CU, "underlay-opacity": .18, "underlay-padding": 7, "underlay-shape": "round-rectangle" } },
      { selector: "node.prev", style: { "border-color": CU, "border-width": 3, "border-style": "solid", color: "#1f2328" } },
      { selector: "edge.prev", style: { "line-color": CU, "target-arrow-color": CU, opacity: 1, width: 3 } },
      { selector: "node.prevrm", style: { "border-color": "#b23a2b", "border-width": 3, "border-style": "dashed" } },
      { selector: "edge.prevrm", style: { "line-color": "#b23a2b", "target-arrow-color": "#b23a2b", width: 3 } },
    ],
  });
  cy.on("tap", "node", e => onTap("n", +e.target.id().slice(1), e));
  cy.on("tap", "edge", e => onTap("a", +e.target.id().slice(1), e));
  cy.on("tap", e => { if (e.target === cy) { closePop(); select(null); } });
  cy.on("dragfree", "node", e => {
    const p = e.target.position();
    api("positions", { pos: [{ id: +e.target.id().slice(1), x: p.x, y: p.y }] }).catch(() => {});
  });
  cy.on("mouseover", "node", e => { if (S.mode === "contribute") showHandle(e.target); else hoverCurate("n", +e.target.id().slice(1), e); });
  cy.on("mouseover", "edge", e => { if (S.mode === "curate") hoverCurate("a", +e.target.id().slice(1), e); });
  cy.on("mouseout", "node, edge", () => { if (S.mode === "curate") clearPreview(); else hideHandleSoon(); });
  cy.on("pan zoom drag position", () => { if (handleNode) placeHandle(handleNode); });
}
function nodeEl(n) {
  const t = TYPE[n.type];
  return { group: "nodes", data: { id: "n" + n.id, label: `${t.g} ${n.type}\n${n.title}`, bg: t.b, fg: t.c }, position: { x: n.x || 0, y: n.y || 0 } };
}
function sync() {
  const g = S.g;
  document.getElementById("empty").hidden = g.nodes.length > 0;
  const want = new Set([...g.nodes.map(n => "n" + n.id), ...g.arcs.map(a => "a" + a.id)]);
  cy.batch(() => {
    cy.elements().forEach(el => { if (!want.has(el.id())) el.remove(); });
    for (const n of g.nodes) {
      const el = cy.$id("n" + n.id), d = nodeEl(n);
      if (el.empty()) cy.add(d);
      else {
        el.data(d.data);
        if (!el.grabbed() && n.x !== null && (Math.abs(el.position("x") - n.x) > .5 || Math.abs(el.position("y") - n.y) > .5)) el.position(d.position);
      }
    }
    for (const a of g.arcs) if (cy.$id("a" + a.id).empty())
      cy.add({ group: "edges", data: { id: "a" + a.id, source: "n" + a.src, target: "n" + a.dst, label: a.label } });
  });
  if (g.nodes.some(n => n.x === null)) tidy(true);
  paint();
}
function paint() {
  cy.elements().removeClass("acc no front");
  cy.autoungrabify(S.mode === "curate");
  if (S.mode === "curate" && S.cur) {
    const an = new Set(S.cur.nodes), aa = new Set(S.cur.arcs), fr = new Set(S.cur.front);
    cy.nodes().forEach(el => { const id = +el.id().slice(1); el.addClass(an.has(id) ? (fr.has(id) ? "acc front" : "acc") : "no"); });

    h("p", {}, "Science as a graph instead of a pile of papers. ", h("b", {}, "Nodes"), " are models, theorems, datasets, experiments and so on; ",
      h("b", {}, "arcs"), " say how one builds on another (an experiment ", h("i", {}, "validates"), " a model). Both are ", h("b", {}, "contributions"), ", each credited to its contributor."),
    h("p", {}, h("b", { style: { color: CO } }, "Contribute"), ": drag parts onto the canvas and connect them."),
    h("p", {}, h("b", { style: { color: CU } }, "Curate"), ": a curator, such as a venue or a lab, accepts contributions one by one. Accepting an arc also accepts its two ends; un-accepting a node also removes its accepted arcs."),
    h("div", { class: "legend" },
      sw("model", { background: "#fff", border: "1.6px dashed #b9bcc1" }), h("span", {}, "not accepted (yet)"),
      sw("model"), h("span", {}, "accepted"),
      sw("model", { border: `3.5px solid ${CU}`, boxShadow: "0 0 0 5px rgba(47,111,143,.18)" }), h("span", {}, h("b", {}, "front"), ": accepted, and nothing accepted builds on it yet")),
    h("p", { class: "muted" }, "Export a curator's front as JSON. To try things out without touching the main graph, generate a sample graph from the ⋯ menu."),
  ]);
}
function sampleModal() {
  const vals = { nodes: 25, arcs: 1.5, accept: 0.5 };
  modal(close => {
    const rng = (k, label, min, max, step, fmt) => {
      const out = h("b", {}, fmt(vals[k]));
      const inp = h("input", { type: "range", min, max, step, value: vals[k], oninput: e => { vals[k] = +e.target.value; out.textContent = fmt(vals[k]); } });
      return h("div", { class: "range" }, h("label", {}, label, out), inp);
    };
    const go = h("button", { class: "btn", onclick: async () => {
      go.disabled = true;
      try {
        const r = await api("/api/sample", vals);
        const k = store.get("keys", {}); k[r.graph + ":" + r.curator.id] = r.curator.key; store.set("keys", k);
        location.href = `?g=${r.graph}&mode=curate&curator=${r.curator.id}`;
      } catch (e) { go.disabled = false; flash(e.message, true); close(); }
    } }, "Generate");
    return [h("h2", {}, "Generate a sample graph"),
      h("p", { class: "muted" }, "A random graph of its own, separate from the main graph, with a sample curator you can take over."),
      rng("nodes", "Nodes", 5, 150, 1, v => v),
      rng("arcs", "Arcs per node", 0, 3, 0.1, v => v.toFixed(1)),
      rng("accept", "Accepted by the sample curator", 0, 1, 0.05, v => Math.round(v * 100) + "%"),
      go];
  });
}
function openMenu() {
  const m = document.getElementById("menu");
  if (!m.hidden) { m.hidden = true; return; }
  m.replaceChildren(
    h("button", { onclick: () => { m.hidden = true; sampleModal(); } }, "Generate a sample graph…"),
    h("button", { onclick: () => { m.hidden = true; tidy(false); } }, "Tidy up the layout"),
    h("button", { onclick: () => { m.hidden = true; cy.animate({ fit: { padding: 40 }, duration: 300 }); } }, "Fit to screen"),
    GID !== "main" ? h("button", { onclick: () => { location.href = "?"; } }, "Go to the main graph") : null,
    h("button", { onclick: () => { m.hidden = true; helpModal(); } }, "What is this?"));
  m.hidden = false;
}

// ---------- boot ----------
document.getElementById("mContribute").onclick = () => setMode("contribute");
document.getElementById("mCurate").onclick = () => setMode("curate");
document.getElementById("helpBtn").onclick = helpModal;
document.getElementById("menuBtn").onclick = e => { e.stopPropagation(); openMenu(); };
document.addEventListener("click", e => { const m = document.getElementById("menu"); if (!m.hidden && !m.contains(e.target)) m.hidden = true; });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closePop();
  if ((e.ctrlKey || e.metaKey) && e.key === "z" && S.mode === "curate" && !e.target.matches("input,textarea")) { e.preventDefault(); undo(); }
});
window.addEventListener("resize", header);
(async () => {
  buildToolbox(); initCy(); setMode(S.mode);
  try { await refresh(); cy.fit(undefined, 40); if (cy.zoom() > 1.2) { cy.zoom(1.2); cy.center(); } }
  catch (e) { document.getElementById("panel").textContent = "Cannot load this graph: " + e.message; }
  if (!store.get("seen", false)) { store.set("seen", true); helpModal(); }
  setInterval(() => {
    if (document.visibilityState !== "visible" || popEl || wiring || S.busy || document.getElementById("modalRoot").childNodes.length
        || document.activeElement.matches("input,textarea") || cy.nodes(":grabbed").length) return;
    refresh().catch(() => {});
  }, 10000);
})();
</script>
</body>
